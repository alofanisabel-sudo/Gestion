<style>

*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:240px 1fr}.sidebar{background:#11151d;color:#fff;padding:24px 16px;display:flex;flex-direction:column;gap:26px}.brand{display:flex;align-items:center;gap:11px;padding:0 8px}.brandmark{width:37px;height:37px;border-radius:11px;background:var(--accent);color:#11151d;display:grid;place-items:center;font-weight:900;font-size:17px}.brand strong{letter-spacing:1.3px;font-size:14px}.brand small{display:block;color:#9ca3af;font-size:11px;letter-spacing:.2px;margin-top:2px}.navlabel{font-size:10px;letter-spacing:1.4px;color:#77808f;padding:0 12px;margin:3px 0 8px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#aeb4c0;text-align:left;padding:11px 12px;border-radius:9px;display:flex;align-items:center;gap:12px;font-size:13px}.nav button.active,.nav button:hover{background:#272d38;color:white}.nav button.active:before{content:"";width:3px;height:18px;background:var(--accent);border-radius:3px;margin-left:-12px;margin-right:9px}.ico{width:17px;text-align:center;font-size:16px}.sidebottom{margin-top:auto;background:#1c222d;border:1px solid #303744;border-radius:13px;padding:14px}.sidebottom b{font-size:12px}.sidebottom p{color:#aab0bc;font-size:11px;line-height:1.6}.sidebottom button{background:var(--accent);border:0;border-radius:8px;padding:9px 10px;width:100%;font-weight:750;font-size:12px}.main{min-width:0}.topbar{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;gap:20px}.crumb{color:var(--muted);font-size:12px}.topbar h1{font-size:19px;margin:3px 0 0;letter-spacing:-.4px}.topright{display:flex;align-items:center;gap:12px}.pill{border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:#fff;font-size:12px;color:#454b58}.avatar{width:36px;height:36px;border-radius:50%;background:#e8f4d9;display:grid;place-items:center;font-weight:800}.content{max-width:1450px;margin:auto;padding:27px 34px 50px}.welcome{display:flex;align-items:flex-end;justify-content:space-between;gap:15px;margin-bottom:22px}.welcome h2{font-size:23px;letter-spacing:-.7px;margin:0 0 6px}.welcome p{margin:0;color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 14px;font-weight:650;font-size:12px;color:#303642}.btn.primary{background:var(--ink);color:white;border-color:var(--ink)}.btn.lime{background:var(--accent);border-color:var(--accent);color:#17200e}.btn:hover{transform:translateY(-1px)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);min-width:0}.stathead{display:flex;justify-content:space-between;align-items:center;color:#626977;font-size:12px}.staticon{width:30px;height:30px;border-radius:9px;background:#f0f2f5;display:grid;place-items:center}.statvalue{font-size:25px;letter-spacing:-.8px;font-weight:780;margin:14px 0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.statfoot{font-size:11px;color:var(--muted)}.statfoot b{color:var(--green)}.grid2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,1fr);gap:16px;margin-bottom:16px}.cardtitle{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}.cardtitle h3{margin:0;font-size:14px}.cardtitle span{font-size:11px;color:var(--muted)}.chart{height:200px;display:flex;align-items:flex-end;gap:clamp(8px,2vw,20px);padding:15px 4px 0;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0,transparent 48px,#f0f1f4 49px,#f0f1f4 50px)}.barwrap{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:8px;min-width:0}.bar{width:min(35px,75%);background:#d8dce3;border-radius:6px 6px 2px 2px;min-height:3px;transition:height .3s}.bar.hi{background:var(--ink)}.barlabel{font-size:10px;color:#8a909c;margin-bottom:-22px;transform:translateY(23px)}.legend{display:flex;gap:16px;margin-top:30px;color:var(--muted);font-size:11px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ink);margin-right:5px}.dot.grey{background:#d8dce3}.productrow,.activityrow{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid #f0f1f4}.productrow:last-child,.activityrow:last-child{border:0}.productbadge{width:37px;height:37px;border-radius:10px;background:#f1f3f6;display:grid;place-items:center;font-weight:800;color:#535a68}.productmeta{flex:1;min-width:0}.productmeta b{font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.productmeta small{font-size:11px;color:var(--muted)}.amount{font-size:12px;font-weight:750;white-space:nowrap}.low{color:var(--red)}.tag{border-radius:20px;background:#edf8e3;color:#35631b;padding:5px 8px;font-size:10px;font-weight:700}.tag.warn{background:#fff1df;color:#8d5a12}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:3px 0 20px;gap:15px}.sectionhead h2{font-size:23px;letter-spacing:-.6px;margin:0}.sectionhead p{color:var(--muted);margin:5px 0 0;font-size:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.search{border:1px solid var(--line);border-radius:9px;background:white;padding:10px 12px;min-width:200px;outline:none}.search:focus,input:focus,select:focus{border-color:#a8cf79;box-shadow:0 0 0 3px #b7f36b30}.tablewrap{overflow:auto;background:white;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}table{width:100%;border-collapse:collapse;min-width:650px}th{text-align:left;padding:13px 17px;font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:#7d8390;background:#fafbfc;border-bottom:1px solid var(--line)}td{padding:14px 17px;border-bottom:1px solid #f0f1f4;font-size:12px}tr:last-child td{border-bottom:0}.empty{text-align:center;color:var(--muted);padding:35px}.modalback{position:fixed;inset:0;background:#11182775;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modalback.show{display:flex}.modal{background:white;width:min(500px,100%);border-radius:16px;padding:23px;box-shadow:0 25px 90px #0003;max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modalhead h3{margin:0;font-size:18px}.x{border:0;background:#f1f2f5;border-radius:8px;width:32px;height:32px;font-size:18px}.field{display:grid;gap:6px;margin:13px 0}.field label{font-size:11px;font-weight:700;color:#515866}.field input,.field select,.field textarea{border:1px solid #dfe2e8;border-radius:9px;padding:11px 12px;outline:none;width:100%;background:#fff}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.notice{border-radius:10px;background:#f2f9e9;padding:12px;color:#3e5d2a;font-size:12px;margin:12px 0}.hidden{display:none!important}.quickgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.quick{padding:17px;border:1px solid var(--line);background:#fff;border-radius:12px;text-align:left}.quick b{display:block;margin:9px 0 4px;font-size:13px}.quick span{color:var(--muted);font-size:11px}.reportcards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.reportcards .card{box-shadow:none}.big{font-size:22px;font-weight:800;margin-top:8px}.settingsgrid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.aiquestion{display:flex;gap:8px;margin-top:14px}.aiquestion input{flex:1;border:1px solid var(--line);border-radius:9px;padding:12px}.mobilemenu{display:none}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#151821;color:white;padding:12px 18px;border-radius:10px;box-shadow:0 8px 30px #0002;z-index:40;font-size:12px}
@media(max-width:1000px){.app{grid-template-columns:205px 1fr}.sidebar{padding:20px 12px}.topbar{padding:0 22px}.content{padding:23px 22px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}.chart{height:175px}}
@media(max-width:680px){.app{display:block}.sidebar{position:fixed;z-index:15;left:-250px;top:0;bottom:0;width:240px;transition:left .2s;box-shadow:15px 0 35px #0002}.sidebar.open{left:0}.mobilemenu{display:inline-grid;place-items:center;border:1px solid var(--line);background:white;border-radius:8px;width:36px;height:36px}.topbar{height:67px;padding:0 15px}.topbar h1{font-size:16px}.crumb,.topright .pill{display:none}.topright{gap:7px}.content{padding:20px 14px 40px}.welcome{align-items:flex-start;flex-direction:column}.welcome h2,.sectionhead h2{font-size:21px}.stats{gap:9px}.card{padding:14px;border-radius:12px}.statvalue{font-size:21px}.stathead{font-size:11px}.grid2{gap:12px}.quickgrid{grid-template-columns:1fr}.reportcards{grid-template-columns:1fr}.settingsgrid{grid-template-columns:1fr}.sectionhead{align-items:flex-start;flex-direction:column}.search{min-width:0;width:100%}.toolbar{width:100%}.toolbar .search{flex:1}.formgrid{grid-template-columns:1fr}.avatar{width:32px;height:32px}.chart{gap:8px}.barlabel{font-size:9px}}
#printzone{display:none}
@media print{body.printing{background:#fff}body.printing .app,body.printing .modalback,body.printing .toast{display:none!important}body.printing #printzone{display:block;color:#111;font-family:Arial,Helvetica,sans-serif}@page{margin:12mm}.pz h1{font-size:20px;margin:0 0 4px}.pz .meta{color:#666;font-size:11px;margin-bottom:14px}.pz table{width:100%;min-width:0;border-collapse:collapse}.pz th{background:#eef0f4;color:#222;font-size:10px;text-transform:uppercase;text-align:left;padding:7px 8px;border:1px solid #cfd3da;-webkit-print-color-adjust:exact;print-color-adjust:exact}.pz td{font-size:11px;padding:7px 8px;border:1px solid #dcdfe5}.pz tr{page-break-inside:avoid}.pz th.r,.pz td.r{text-align:right}.pz .foot{margin-top:14px;font-size:12px;font-weight:700}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="brandmark">K</div><div><strong>KAGIS BUSINESS</strong><small>La gestion, en plus simple.</small></div></div>
  <div><div class="navlabel">ESPACE DE TRAVAIL</div><nav class="nav" id="nav">
    <button class="active" data-page="dashboard"><span class="ico">▦</span>Vue d'ensemble</button>
    <button data-page="sales"><span class="ico">↗</span>Ventes</button>
    <button data-page="products"><span class="ico">▤</span>Produits & stocks</button>
    <button data-page="finance"><span class="ico">◷</span>Finances</button>
    <button data-page="customers"><span class="ico">♙</span>Clients & crédits</button>
    <button data-page="reports"><span class="ico">▥</span>Rapports</button>
    <button data-page="assistant"><span class="ico">✳</span>Assistant IA <span class="tag" style="margin-left:auto">BÊTA</span></button>
  </nav></div>
  <div><div class="navlabel">CONFIGURATION</div><nav class="nav">
    <button data-page="settings"><span class="ico">⚙</span>Paramètres</button>
  </nav></div>
  <div class="sidebottom"><b>Un outil pensé pour vous.</b><p>Commencez simplement. Vos données restent sur cet appareil.</p><button onclick="openModal('sale')">＋ Enregistrer une vente</button><button id="installbtn" class="hidden" onclick="installApp()" style="margin-top:8px;background:#272d38;color:#fff">⬇ Installer l'application</button></div>
</aside>
<main class="main">
<header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="mobilemenu" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button><div><div class="crumb">KAGIS BUSINESS / <span id="crumb">TABLEAU DE BORD</span></div><h1 id="pagetitle">Vue d'ensemble</h1></div></div><div class="topright"><span class="pill">🇧🇯 Bénin · XOF</span><div class="avatar" id="avatar">KB</div></div></header>
<div class="content" id="content"></div>
</main></div>
<div class="modalback" id="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h3 id="modaltitle">Nouvelle opération</h3><button class="x" onclick="closeModal()">×</button></div><div id="modalbody"></div></div></div>
<div id="printzone" class="pz"></div>
<script>
const fmt=n=>new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0}).format(Number(n)||0)+' F CFA';
const dstr=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>dstr(new Date());
const receiptNo=n=>'KB-'+String(n).padStart(4,'0');
const seed={
 company:{name:"Ma boutique",owner:"Gestionnaire",phone:"",currency:"XOF"},
 products:[
 {id:1,name:"T-shirt KAGIS",sku:"KGS-001",buy:3500,sell:6500,stock:18,min:5},
 {id:2,name:"Casquette classique",sku:"CAP-002",buy:1800,sell:3500,stock:7,min:5},
 {id:3,name:"Sac en toile",sku:"BAG-003",buy:2200,sell:5000,stock:3,min:5},
 {id:4,name:"Gourde réutilisable",sku:"BOT-004",buy:2500,sell:4500,stock:12,min:4}],
 sales:[
 {id:1001,date:today(),customer:"Client comptoir",items:[{productId:1,name:"T-shirt KAGIS",qty:2,price:6500,buy:3500}],total:13000,paid:13000,method:"Espèces"},
 {id:1002,date:today(),customer:"Hervé",items:[{productId:3,name:"Sac en toile",qty:1,price:5000,buy:2200}],total:5000,paid:3000,method:"Mobile Money"},
 {id:1003,date:dstr(new Date(Date.now()-86400000*2)),customer:"Aminata",items:[{productId:2,name:"Casquette classique",qty:2,price:3500,buy:1800}],total:7000,paid:7000,method:"Espèces"}],
 expenses:[{id:2001,date:today(),label:"Transport et livraison",category:"Transport",amount:1500},{id:2002,date:dstr(new Date(Date.now()-86400000*1)),label:"Emballages",category:"Fournitures",amount:800}],
 customers:[{id:1,name:"Hervé",phone:"",note:"Client régulier"},{id:2,name:"Aminata",phone:"",note:""}],
 nextId:3000,
 receiptSeq:0,
 lastBackup:null
};
function migrate(d){d.receiptSeq=d.receiptSeq||0;d.customers=d.customers||[];d.sales.forEach(x=>{if(!x.payments)x.payments=x.paid>0?[{date:x.date,amount:x.paid}]:[];if(x.customerId===undefined){let m=d.customers.filter(c=>c.name.toLowerCase()===String(x.customer||'').toLowerCase());x.customerId=m.length===1?m[0].id:null}});d.lastBackup=d.lastBackup||null;d.sales.slice().sort((a,b)=>a.id-b.id).forEach(x=>{if(!x.receipt)x.receipt=receiptNo(++d.receiptSeq)});return d}
const blank=()=>({company:{name:"Ma boutique",owner:"Gestionnaire",phone:"",currency:"XOF"},products:[],sales:[],expenses:[],customers:[],nextId:1,receiptSeq:0,lastBackup:null});
let db;try{db=migrate(JSON.parse(localStorage.getItem('kagis_db'))||blank())}catch(e){db=migrate(blank())}
let page='dashboard';
function save(){try{localStorage.setItem('kagis_db',JSON.stringify(db))}catch(e){toast('Impossible d’enregistrer sur cet appareil. Faites une sauvegarde JSON maintenant.')}}
function allRevenue(){return db.sales.reduce((s,x)=>s+x.total,0)}
function totalPaid(){return db.sales.reduce((s,x)=>s+x.paid,0)}
function totalExpenses(){return db.expenses.reduce((s,x)=>s+x.amount,0)}
function grossProfit(sales=db.sales){return sales.reduce((sum,s)=>sum+s.items.reduce((a,i)=>a+(i.price-i.buy)*i.qty,0),0)}
function due(s){return Math.max(0,s.total-s.paid)}
function byDate(arr,days){let cutoff=dstr(new Date(Date.now()-days*86400000));return arr.filter(x=>x.date>=cutoff)}
function currentTitle(){return ({dashboard:"Vue d'ensemble",sales:"Ventes",products:"Produits & stocks",finance:"Finances",customers:"Clients & crédits",reports:"Rapports",assistant:"Assistant IA",settings:"Paramètres"})[page]}
function go(p){page=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('pagetitle').textContent=currentTitle();document.getElementById('crumb').textContent=currentTitle().toUpperCase();document.getElementById('sidebar').classList.remove('open');render()}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));
function shellHead(title,desc,actions=''){return `<div class="sectionhead"><div><h2>${title}</h2><p>${desc}</p></div><div class="toolbar">${actions}</div></div>`}
function stat(label,value,icon,foot='Données enregistrées'){return `<div class="card"><div class="stathead">${label}<span class="staticon">${icon}</span></div><div class="statvalue">${value}</div><div class="statfoot">${foot}</div></div>`}
function backupBanner(){let old=!db.lastBackup||(Date.now()-new Date(db.lastBackup).getTime())>7*86400000;if(!(db.sales.length||db.products.length||db.customers.length)||!old)return '';return `<div class="card" style="margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap"><div><b>Pensez à sauvegarder vos données</b><div class="statfoot" style="margin-top:4px">${db.lastBackup?'Dernière sauvegarde : '+esc(db.lastBackup):'Aucune sauvegarde faite pour l’instant.'} Vos données sont uniquement sur ce téléphone.</div></div><button class="btn lime" onclick="backup()">Sauvegarder maintenant</button></div>`}
function dashboard(){let salesToday=db.sales.filter(s=>s.date===today()),rev=salesToday.reduce((a,s)=>a+s.total,0),profit=grossProfit(salesToday),unpaid=db.sales.reduce((a,s)=>a+due(s),0),low=db.products.filter(p=>p.stock<=p.min);let days=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];let bars=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-(6-i));let date=dstr(d);return {label:days[(d.getDay()+6)%7],value:db.sales.filter(s=>s.date===date).reduce((a,s)=>a+s.total,0)}});let max=Math.max(...bars.map(b=>b.value),1);
return `${backupBanner()}<div class="welcome"><div><h2>Bonjour, ${esc(db.company.owner||'entrepreneur')} 👋</h2><p>Voici ce qui se passe dans votre activité aujourd'hui.</p></div><div class="actions"><button class="btn" onclick="openModal('expense')">＋ Dépense</button><button class="btn primary" onclick="openModal('sale')">＋ Nouvelle vente</button></div></div>
<div class="stats">${stat("Ventes du jour",fmt(rev),"↗",salesToday.length+" transaction(s) aujourd'hui")}${stat("Marge brute estimée",fmt(profit),"◈","Avant charges et autres frais")}${stat("Montant restant à encaisser",fmt(unpaid),"◷","Crédits et paiements partiels")}${stat("Articles en stock",db.products.reduce((a,p)=>a+p.stock,0),"▤",db.products.length+" références au catalogue")}</div>
<div class="grid2"><div class="card"><div class="cardtitle"><h3>Activité commerciale</h3><span>7 derniers jours · XOF</span></div><div class="chart">${bars.map((b,i)=>`<div class="barwrap"><div class="bar ${i===6?'hi':''}" title="${fmt(b.value)}" style="height:${Math.max(2,b.value/max*83)}%"></div><div class="barlabel">${b.label}</div></div>`).join('')}</div><div class="legend"><span><i class="dot"></i>Chiffre d'affaires par jour</span><span><i class="dot grey"></i>Les jours sans vente restent à zéro</span></div></div>
<div class="card"><div class="cardtitle"><h3>Stock à surveiller</h3><span>${low.length} alerte(s)</span></div>${low.length?low.map(p=>`<div class="productrow"><div class="productbadge">▤</div><div class="productmeta"><b>${esc(p.name)}</b><small>Seuil d'alerte : ${p.min} unités</small></div><span class="tag warn">${p.stock} restant(s)</span></div>`).join(''):'<div class="empty">Tout va bien : aucun stock faible.</div>'}<button class="btn" style="width:100%;margin-top:12px" onclick="go('products')">Voir les produits →</button></div></div>
<div class="grid2"><div class="card"><div class="cardtitle"><h3>Dernières ventes</h3><button class="btn" onclick="go('sales')">Tout voir →</button></div>${db.sales.slice().sort((a,b)=>b.id-a.id).slice(0,4).map(s=>`<div class="activityrow"><div class="productbadge">↗</div><div class="productmeta"><b>${esc(cn(s))}</b><small>${s.date} · ${s.items.reduce((a,i)=>a+i.qty,0)} article(s)</small></div><div style="text-align:right"><div class="amount">${fmt(s.total)}</div><small class="${due(s)?'low':''}">${due(s)?'Reste '+fmt(due(s)):'Payé'}</small></div></div>`).join('')||'<div class="empty">Aucune vente pour le moment.</div>'}</div>
<div class="card"><div class="cardtitle"><h3>Votre activité en chiffres</h3><span>Depuis le démarrage</span></div><div class="productrow"><div class="productmeta"><b>Chiffre d'affaires</b><small>Montant total des ventes enregistrées</small></div><span class="amount">${fmt(allRevenue())}</span></div><div class="productrow"><div class="productmeta"><b>Encaissements</b><small>Argent effectivement reçu selon les saisies</small></div><span class="amount">${fmt(totalPaid())}</span></div><div class="productrow"><div class="productmeta"><b>Dépenses saisies</b><small>Ne comprend que les dépenses enregistrées</small></div><span class="amount">${fmt(totalExpenses())}</span></div><div class="notice">La marge brute n'est pas le bénéfice net. Les frais non saisis et les impôts ne sont pas inclus.</div></div></div>`}
function salesPage(){return `${shellHead("Historique des ventes","Suivez les transactions et les montants restant à encaisser.",'<button class="btn lime" onclick="exportPDF(&#39;sales&#39;)">Exporter PDF</button><button class="btn" onclick="exportCSV(&#39;sales&#39;)">Exporter CSV</button><button class="btn primary" onclick="openModal(&#39;sale&#39;)">＋ Nouvelle vente</button>')}<div class="toolbar" style="margin-bottom:13px"><input class="search" placeholder="Rechercher un client ou une date…" oninput="filterTable(this,'salestable')"></div><div class="tablewrap"><table id="salestable"><thead><tr><th>Référence</th><th>Date</th><th>Client</th><th>Articles</th><th>Total</th><th>Payé</th><th>Reste</th><th>Action</th></tr></thead><tbody>${db.sales.slice().sort((a,b)=>b.id-a.id).map(s=>`<tr><td>${esc(s.receipt)}</td><td>${s.date}</td><td>${esc(cn(s))}</td><td>${s.items.reduce((a,i)=>a+i.qty,0)}</td><td><b>${fmt(s.total)}</b></td><td>${fmt(s.paid)}</td><td class="${due(s)?'low':''}">${fmt(due(s))}</td><td><button class="btn" onclick="openModal('saleedit',${s.id})">Modifier</button><button class="btn" onclick="receipt(${s.id})">Reçu</button></td></tr>`).join('')||'<tr><td colspan="8" class="empty">Aucune vente enregistrée.</td></tr>'}</tbody></table></div>`}
function productsPage(){return `${shellHead("Produits & stocks","Prix d'achat, prix de vente et quantités disponibles.",'<button class="btn lime" onclick="exportPDF(&#39;products&#39;)">Exporter PDF</button><button class="btn" onclick="exportCSV(&#39;products&#39;)">Exporter CSV</button><button class="btn primary" onclick="openModal(&#39;product&#39;)">＋ Ajouter un produit</button>')}<div class="stats">${stat("Références",db.products.length,"▤","Produits enregistrés")}${stat("Unités disponibles",db.products.reduce((a,p)=>a+p.stock,0),"▦","Quantités cumulées")}${stat("Valeur au prix d'achat",fmt(db.products.reduce((a,p)=>a+p.stock*p.buy,0)),"◈","Estimation du stock")}${stat("Stock faible",db.products.filter(p=>p.stock<=p.min).length,"⚠","À réapprovisionner")}</div><div class="toolbar" style="margin-bottom:13px"><input class="search" placeholder="Rechercher un produit…" oninput="filterTable(this,'producttable')"></div><div class="tablewrap"><table id="producttable"><thead><tr><th>Produit</th><th>Référence</th><th>Prix d'achat</th><th>Prix de vente</th><th>Marge unitaire</th><th>Stock</th><th>Statut</th><th></th></tr></thead><tbody>${db.products.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${esc(p.sku||'—')}</td><td>${fmt(p.buy)}</td><td>${fmt(p.sell)}</td><td>${fmt(p.sell-p.buy)}</td><td>${p.stock}</td><td><span class="tag ${p.stock<=p.min?'warn':''}">${p.stock<=p.min?'Stock faible':'Disponible'}</span></td><td><button class="btn" onclick="editProduct(${p.id})">Modifier</button></td></tr>`).join('')||'<tr><td colspan="8" class="empty">Ajoutez votre premier produit.</td></tr>'}</tbody></table></div>`}
function financePage(){let gp=grossProfit(),net=gp-totalExpenses();return `${shellHead("Finances","Distinguez vos ventes, votre marge, vos dépenses et votre trésorerie.",'<button class="btn lime" onclick="exportPDF(&#39;expenses&#39;)">Exporter PDF</button><button class="btn" onclick="exportCSV(&#39;expenses&#39;)">Exporter dépenses</button><button class="btn primary" onclick="openModal(&#39;expense&#39;)">＋ Enregistrer une dépense</button>')}<div class="stats">${stat("Chiffre d'affaires",fmt(allRevenue()),"↗","Valeur totale des ventes")}${stat("Marge brute estimée",fmt(gp),"◈","Ventes moins coût des articles vendus")}${stat("Dépenses enregistrées",fmt(totalExpenses()),"↘","Charges saisies dans l'application")}${stat("Résultat indicatif",fmt(net),"＝","Marge brute moins dépenses saisies")}</div><div class="notice">Important : le résultat est une estimation simplifiée. Il peut exclure salaires, impôts, pertes, frais financiers et autres charges non enregistrées. La trésorerie encaissée (${fmt(totalPaid())}) est différente du chiffre d'affaires (${fmt(allRevenue())}).</div><div class="card"><div class="cardtitle"><h3>Journal des dépenses</h3><span>${db.expenses.length} opération(s)</span></div><div class="tablewrap" style="box-shadow:none"><table><thead><tr><th>Date</th><th>Libellé</th><th>Catégorie</th><th>Montant</th><th></th></tr></thead><tbody>${db.expenses.slice().sort((a,b)=>b.id-a.id).map(e=>`<tr><td>${e.date}</td><td>${esc(e.label)}</td><td>${esc(e.category)}</td><td><b>${fmt(e.amount)}</b></td><td><button class="btn" onclick="openModal('expense',${e.id})">Modifier</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Aucune dépense enregistrée.</td></tr>'}</tbody></table></div></div>`}
function customersPage(){let debts=db.sales.reduce((a,s)=>a+due(s),0);return `${shellHead("Clients & crédits","Gardez une trace des clients et des paiements en attente.",'<button class="btn" onclick="openModal(&#39;customer&#39;)">＋ Nouveau client</button>')}<div class="stats">${stat("Clients enregistrés",db.customers.length,"♙","Carnet de clients")}${stat("Crédits à recouvrer",fmt(debts),"◷","Sur les ventes enregistrées")}${stat("Ventes à crédit",db.sales.filter(s=>due(s)>0).length,"↗","Avec solde restant")}${stat("Montant encaissé",fmt(totalPaid()),"✓","Paiements saisis")}</div><div class="card" style="margin-bottom:15px"><div class="cardtitle"><h3>Clients</h3><span>Coordonnées et suivi</span></div>${db.customers.map(c=>{let duec=db.sales.filter(s=>s.customerId===c.id).reduce((a,s)=>a+due(s),0);return `<div class="activityrow"><div class="avatar">${esc(c.name.slice(0,1).toUpperCase())}</div><div class="productmeta"><b>${esc(c.name)}</b><small>${esc(c.phone||'Téléphone non renseigné')} · ${esc(c.note||'Client')}</small></div><div style="text-align:right"><div class="amount ${duec?'low':''}">${fmt(duec)}</div><small>${duec?'Reste à payer':'Aucun solde connu'}</small></div><button class="btn" onclick="openModal('customer',${c.id})">Modifier</button><button class="btn" onclick="remind(${c.id})">Relancer</button></div>`}).join('')||'<div class="empty">Ajoutez un client pour commencer.</div>'}</div><div class="card"><div class="cardtitle"><h3>Crédits et paiements partiels</h3><span>Vérifiez avant toute relance</span></div><div class="tablewrap" style="box-shadow:none"><table><thead><tr><th>Référence</th><th>Client</th><th>Date</th><th>Montant dû</th><th>Action</th></tr></thead><tbody>${db.sales.filter(s=>due(s)>0).map(s=>`<tr><td>${esc(s.receipt)}</td><td>${esc(cn(s))}</td><td>${s.date}</td><td class="low"><b>${fmt(due(s))}</b></td><td><button class="btn" onclick="payment(${s.id})">Enregistrer paiement</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Aucun paiement en attente.</td></tr>'}</tbody></table></div></div>`}
function reportsPage(){let rev30=byDate(db.sales,30).reduce((a,s)=>a+s.total,0),cost30=byDate(db.sales,30).reduce((a,s)=>a+s.items.reduce((z,i)=>z+i.buy*i.qty,0),0),exp30=byDate(db.expenses,30).reduce((a,e)=>a+e.amount,0);return `${shellHead("Rapports","Un aperçu simple de votre activité et des données exportables.",'<button class="btn lime" onclick="exportPDF(&#39;sales&#39;)">Exporter PDF</button><button class="btn" onclick="exportCSV(&#39;sales&#39;)">Télécharger ventes CSV</button><button class="btn primary" onclick="window.print()">Imprimer / PDF</button>')}<div class="reportcards"><div class="card"><span class="statfoot">CA des 30 derniers jours</span><div class="big">${fmt(rev30)}</div></div><div class="card"><span class="statfoot">Marge brute estimée · 30 jours</span><div class="big">${fmt(rev30-cost30)}</div></div><div class="card"><span class="statfoot">Dépenses saisies · 30 jours</span><div class="big">${fmt(exp30)}</div></div></div><div class="card"><div class="cardtitle"><h3>Performance des produits</h3><span>Calculée à partir des ventes enregistrées</span></div><div class="tablewrap" style="box-shadow:none"><table><thead><tr><th>Produit</th><th>Quantités vendues</th><th>CA généré</th><th>Marge brute estimée</th></tr></thead><tbody>${db.products.map(p=>{let its=db.sales.flatMap(s=>s.items).filter(i=>i.productId===p.id);let q=its.reduce((a,i)=>a+i.qty,0),r=its.reduce((a,i)=>a+i.qty*i.price,0),g=its.reduce((a,i)=>a+i.qty*(i.price-i.buy),0);return `<tr><td>${esc(p.name)}</td><td>${q}</td><td>${fmt(r)}</td><td>${fmt(g)}</td></tr>`}).join('')}</tbody></table></div></div>`}
function assistantPage(){return `${shellHead("Assistant IA","Des réponses basées sur les données disponibles dans ce prototype.",'')}<div class="card"><div style="display:flex;gap:14px;align-items:center"><div class="brandmark" style="flex-shrink:0">✳</div><div><h3 style="margin:0 0 5px">Bonjour ! Analysons votre activité.</h3><span style="color:var(--muted);font-size:12px">Choisissez une question ou posez la vôtre. Les réponses sont calculées à partir des données locales, sans modèle IA externe.</span></div></div><div class="quickgrid" style="margin-top:22px"><button class="quick" onclick="ask('rentable')">◈<b>Quels produits sont les plus rentables ?</b><span>Comparer les marges enregistrées</span></button><button class="quick" onclick="ask('depenses')">↘<b>Quelles sont mes dépenses ?</b><span>Voir les principaux postes</span></button><button class="quick" onclick="ask('stock')">▤<b>Que dois-je réapprovisionner ?</b><span>Détecter les stocks faibles</span></button><button class="quick" onclick="ask('semaine')">↗<b>Quel est mon chiffre d'affaires récent ?</b><span>Analyser les 7 derniers jours</span></button><button class="quick" onclick="ask('marge')">◎<b>Comment améliorer mes marges ?</b><span>Conseils fondés sur les prix saisis</span></button><button class="quick" onclick="ask('credit')">◷<b>Combien reste-t-il à encaisser ?</b><span>Suivre les crédits en cours</span></button></div><div class="aiquestion"><input id="aiinput" placeholder="Écrivez votre question…"><button class="btn primary" onclick="ask(document.getElementById('aiinput').value)">Analyser</button></div><div id="airesult" class="notice hidden" style="margin-top:18px;white-space:pre-line"></div><div class="notice">Limite de transparence : cette version ne prétend pas être une IA connectée. Une future version devra utiliser une API sécurisée et des données autorisées, avec contrôle des coûts et protection des informations privées.</div></div>`}
function settingsPage(){return `${shellHead("Paramètres","Personnalisez votre espace professionnel.",'<button class="btn primary" onclick="saveSettings()">Enregistrer les changements</button>')}<div class="settingsgrid"><div class="card"><div class="cardtitle"><h3>Profil de l'entreprise</h3></div><div class="field"><label>Nom de l'entreprise</label><input id="setname" value="${esc(db.company.name)}"></div><div class="field"><label>Nom du gestionnaire</label><input id="setowner" value="${esc(db.company.owner)}"></div><div class="field"><label>Téléphone professionnel</label><input id="setphone" value="${esc(db.company.phone)}" placeholder="+229…"></div><div class="field"><label>Monnaie</label><select disabled><option>Franc CFA BCEAO (XOF)</option></select></div></div><div class="card"><div class="cardtitle"><h3>Données et sécurité</h3></div><p style="color:var(--muted);font-size:12px">Cette démonstration conserve les informations dans le stockage local de ce navigateur. Elles ne sont pas synchronisées entre appareils et peuvent être perdues si les données du navigateur sont effacées.</p><button class="btn" style="width:100%;margin:7px 0" onclick="backup()">Exporter une sauvegarde JSON</button><button class="btn" style="width:100%;margin:7px 0" onclick="document.getElementById('restorefile').click()">Restaurer une sauvegarde JSON</button><input type="file" id="restorefile" accept=".json,application/json" class="hidden" onchange="restore(this)"><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><button class="btn" style="width:100%;margin-bottom:8px" onclick="startFresh()">Tout effacer et repartir à zéro</button><button class="btn" style="width:100%" onclick="resetDemo()">Charger des données d’exemple</button></div></div><div class="notice">Avant une mise en production : authentification, base de données distante, isolation stricte par entreprise, sauvegardes serveur, journal d'audit et tests de sécurité sont indispensables.</div>`}
function render(){document.body.classList.remove('printing');let c=document.getElementById('content');c.innerHTML=({dashboard,sales:salesPage,products:productsPage,finance:financePage,customers:customersPage,reports:reportsPage,assistant:assistantPage,settings:settingsPage})[page]();document.getElementById('avatar').textContent=(db.company.name||'KB').slice(0,2).toUpperCase()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){let old=document.querySelector('.toast');if(old)old.remove();let d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
function filterTable(input,id){let q=input.value.toLowerCase();document.querySelectorAll('#'+id+' tbody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')}
function openModal(type,id=null){editId=id;let body='',title='';if(type==='sale'){title='Enregistrer une vente';cart=[];paidTouched=false;body=`<form onsubmit="submitSale(event)"><div class="field"><label>Client</label><select id="sclient" onchange="document.getElementById('snew').classList.toggle('hidden',this.value!=='new')">${custOpts(null)}<option value="new">＋ Nouveau client…</option></select><input id="snew" class="hidden" placeholder="Nom du nouveau client" style="margin-top:8px"></div><div class="field"><label>Ajouter un article</label><div class="formgrid"><select id="sproduct">${db.products.map(p=>`<option value="${p.id}" ${p.stock<=0?'disabled':''}>${esc(p.name)} — ${fmt(p.sell)} · stock ${p.stock}</option>`).join('')}</select><input id="sqty" type="number" min="1" value="1" aria-label="Quantité"></div><button type="button" class="btn lime" style="margin-top:8px;width:100%" onclick="addToCart()">＋ Ajouter à la vente</button></div><div id="cartbox"></div><div class="formgrid"><div class="field"><label>Mode de paiement</label><select id="smethod" onchange="onMethod()"><option>Espèces</option><option>Mobile Money</option><option>Virement</option><option>Autre</option><option>Crédit</option></select></div><div class="field"><label>Montant encaissé</label><input id="spaid" type="number" min="0" value="0" oninput="paidTouched=true" required></div></div><div class="field"><label>Montant total</label><div id="stotal" class="big">—</div></div><div class="modalactions"><button type="button" class="btn" onclick="closeModal()">Annuler</button><button class="btn primary">Enregistrer la vente</button></div></form>`}
if(type==='product'){title='Ajouter un produit';body=`<form onsubmit="submitProduct(event)"><div class="field"><label>Nom du produit *</label><input id="pname" required></div><div class="field"><label>Référence (facultatif)</label><input id="psku"></div><div class="formgrid"><div class="field"><label>Prix d'achat (F CFA) *</label><input id="pbuy" type="number" min="0" required></div><div class="field"><label>Prix de vente (F CFA) *</label><input id="psell" type="number" min="0" required></div><div class="field"><label>Quantité initiale *</label><input id="pstock" type="number" min="0" required value="0"></div><div class="field"><label>Seuil d'alerte</label><input id="pmin" type="number" min="0" value="5"></div></div><div class="modalactions"><button type="button" class="btn" onclick="closeModal()">Annuler</button><button class="btn primary">Ajouter le produit</button></div></form>`}
if(type==='expense'){title='Enregistrer une dépense';body=`<form onsubmit="submitExpense(event)"><div class="field"><label>Libellé *</label><input id="elabel" placeholder="Ex. transport, emballages…" required></div><div class="formgrid"><div class="field"><label>Montant (F CFA) *</label><input id="eamount" type="number" min="1" required></div><div class="field"><label>Catégorie</label><select id="ecat"><option>Transport</option><option>Fournitures</option><option>Loyer</option><option>Communication</option><option>Salaires</option><option>Autre</option></select></div></div><div class="field"><label>Date</label><input id="edate" type="date" value="${today()}" required></div><div class="modalactions"><button type="button" class="btn" onclick="closeModal()">Annuler</button><button class="btn primary">Enregistrer</button></div></form>`}
if(type==='customer'){title='Ajouter un client';body=`<form onsubmit="submitCustomer(event)"><div class="field"><label>Nom complet *</label><input id="cname" required></div><div class="field"><label>Téléphone WhatsApp (facultatif)</label><input id="cphone" placeholder="+229…"></div><div class="field"><label>Note</label><input id="cnote" placeholder="Ex. client régulier"></div><div class="modalactions"><button type="button" class="btn" onclick="closeModal()">Annuler</button><button class="btn primary">Enregistrer le client</button></div></form>`}
if(type==='saleedit'){let s=db.sales.find(x=>x.id===id);title='Modifier la vente '+s.receipt;body=`<form onsubmit="submitSaleEdit(event,${id})"><div class="field"><label>Client</label><select id="sclient2">${custOpts(s.customerId)}</select></div><div class="formgrid"><div class="field"><label>Date</label><input id="sdate" type="date" value="${s.date}" required></div><div class="field"><label>Mode de paiement</label><select id="smethod2">${['Espèces','Mobile Money','Virement','Autre','Crédit'].map(m=>`<option ${m===s.method?'selected':''}>${m}</option>`).join('')}</select></div></div><div class="field"><label>Articles (pour les changer : supprimez la vente et ressaisissez-la)</label>${s.items.map(i=>`<div class="productrow"><div class="productmeta"><b>${esc(i.name)}</b><small>${i.qty} × ${fmt(i.price)}</small></div></div>`).join('')}</div><div class="field"><label>Paiements reçus (total ${fmt(s.paid)} sur ${fmt(s.total)})</label>${(s.payments||[]).map((p,k)=>`<div class="productrow"><div class="productmeta"><b>${fmt(p.amount)}</b><small>${p.date}</small></div><button type="button" class="btn" onclick="delPay(${id},${k})" aria-label="Retirer ce paiement">×</button></div>`).join('')||'<div class="empty" style="padding:8px 0">Aucun paiement.</div>'}</div><div class="modalactions"><button type="button" class="btn" onclick="delSale(${id})">Supprimer</button><button class="btn primary">Enregistrer</button></div></form>`}
document.getElementById('modaltitle').textContent=title;document.getElementById('modalbody').innerHTML=body;document.getElementById('modalback').classList.add('show');if(type==='sale')renderCart();if(id&&type!=='saleedit')prefill(type,id)}
function closeModal(){editId=null;document.getElementById('modalback').classList.remove('show')}
let cart=[],paidTouched=false,editId=null;
const cartTotal=()=>cart.reduce((a,l)=>a+l.price*l.qty,0);
function renderCart(){let box=document.getElementById('cartbox');if(!box)return;let t=cartTotal();box.innerHTML=cart.length?`<div class="field"><label>Articles de la vente</label>${cart.map((l,i)=>`<div class="productrow"><div class="productmeta"><b>${esc(l.name)}</b><small>${l.qty} × ${fmt(l.price)}</small></div><span class="amount">${fmt(l.price*l.qty)}</span><button type="button" class="btn" onclick="removeLine(${i})" aria-label="Retirer">×</button></div>`).join('')}</div>`:'<div class="empty" style="padding:10px 0">Aucun article ajouté pour l’instant.</div>';document.getElementById('stotal').textContent=cart.length?fmt(t):'—';let paid=document.getElementById('spaid'),m=document.getElementById('smethod');if(paid&&!paidTouched)paid.value=(m&&m.value==='Crédit')?0:t}
function addToCart(){let p=db.products.find(x=>x.id===Number(document.getElementById('sproduct').value)),q=Math.floor(Number(document.getElementById('sqty').value));if(!p||!(q>=1)){toast('Choisissez un produit et une quantité valide.');return}let line=cart.find(l=>l.productId===p.id),already=line?line.qty:0;if(already+q>p.stock){toast('Stock insuffisant : '+p.stock+' disponible(s) pour '+p.name+'.');return}if(line)line.qty+=q;else cart.push({productId:p.id,name:p.name,qty:q,price:p.sell,buy:p.buy});document.getElementById('sqty').value=1;renderCart()}
function removeLine(i){cart.splice(i,1);renderCart()}
function onMethod(){paidTouched=false;renderCart()}
function submitSale(e){e.preventDefault();if(!cart.length){toast('Ajoutez au moins un article à la vente.');return}for(const l of cart){let p=db.products.find(x=>x.id===l.productId);if(!p||l.qty>p.stock){toast('Stock insuffisant pour '+l.name+'.');return}}let total=cartTotal(),paid=Number(document.getElementById('spaid').value)||0;if(paid<0||paid>total){toast('Vérifiez le montant encaissé.');return}let cv=document.getElementById('sclient').value,customerId=null,customer='Client comptoir';if(cv==='new'){let nm=document.getElementById('snew').value.trim();if(!nm){toast('Saisissez le nom du nouveau client.');return}let c={id:db.nextId++,name:nm,phone:'',note:''};db.customers.push(c);customerId=c.id;customer=nm}else if(cv){customerId=Number(cv);customer=db.customers.find(c=>c.id===customerId).name}let sale={id:db.nextId++,receipt:receiptNo(++db.receiptSeq),date:today(),customer,customerId,items:cart.map(l=>({...l})),total,paid,payments:paid>0?[{date:today(),amount:paid}]:[],method:document.getElementById('smethod').value};db.sales.push(sale);cart.forEach(l=>{db.products.find(x=>x.id===l.productId).stock-=l.qty});save();closeModal();render();toast('Vente '+sale.receipt+' enregistrée.')}
function submitProduct(e){e.preventDefault();let ed=editId,v=i=>document.getElementById(i).value,o={name:v('pname').trim(),sku:v('psku').trim(),buy:Number(v('pbuy')),sell:Number(v('psell')),stock:Number(v('pstock')),min:Number(v('pmin'))};if(ed)Object.assign(db.products.find(x=>x.id===ed),o);else db.products.push({id:db.nextId++,...o});save();closeModal();render();toast(ed?'Produit modifié.':'Produit ajouté.')}
function editProduct(id){openModal('product',id)}
function submitExpense(e){e.preventDefault();let ed=editId,v=i=>document.getElementById(i).value,o={date:v('edate'),label:v('elabel').trim(),category:v('ecat'),amount:Number(v('eamount'))};if(ed)Object.assign(db.expenses.find(x=>x.id===ed),o);else db.expenses.push({id:db.nextId++,...o});save();closeModal();render();toast(ed?'Dépense modifiée.':'Dépense enregistrée.')}
function submitCustomer(e){e.preventDefault();let ed=editId,v=i=>document.getElementById(i).value,o={name:v('cname').trim(),phone:v('cphone').trim(),note:v('cnote').trim()};if(ed)Object.assign(db.customers.find(x=>x.id===ed),o);else db.customers.push({id:db.nextId++,...o});save();closeModal();render();toast(ed?'Client modifié.':'Client ajouté.')}
function payment(id){let s=db.sales.find(x=>x.id===id),left=due(s);let amount=prompt('Solde restant : '+fmt(left)+'\nMontant du paiement reçu (F CFA) :',left);if(amount===null)return;amount=Number(amount);if(!Number.isFinite(amount)||amount<=0||amount>left){toast('Montant invalide.');return}s.paid+=amount;(s.payments=s.payments||[]).push({date:today(),amount});save();render();toast('Paiement enregistré.')}
const cn=s=>{let c=s.customerId&&db.customers.find(x=>x.id===s.customerId);return c?c.name:(s.customer||'Client comptoir')};
const custOpts=sel=>'<option value="">Client comptoir</option>'+db.customers.map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.name)}</option>`).join('');
function prefill(t,id){let g=i=>document.getElementById(i),set=m=>Object.entries(m).forEach(([k,v])=>g(k).value=v),o;if(t==='product'){o=db.products.find(x=>x.id===id);set({pname:o.name,psku:o.sku||'',pbuy:o.buy,psell:o.sell,pstock:o.stock,pmin:o.min});g('pstock').previousElementSibling.textContent='Quantité en stock *'}else if(t==='expense'){o=db.expenses.find(x=>x.id===id);set({elabel:o.label,eamount:o.amount,ecat:o.category,edate:o.date})}else{o=db.customers.find(x=>x.id===id);set({cname:o.name,cphone:o.phone||'',cnote:o.note||''})}g('modaltitle').textContent='Modifier';let b=document.querySelector('#modalbody .modalactions');b.insertAdjacentHTML('afterbegin',`<button type="button" class="btn" onclick="delItem('${t}',${id})">Supprimer</button>`);b.lastElementChild.textContent='Enregistrer'}
function submitSaleEdit(e,id){e.preventDefault();let s=db.sales.find(x=>x.id===id),cv=document.getElementById('sclient2').value;s.customerId=cv?Number(cv):null;s.customer=cn(s);s.date=document.getElementById('sdate').value;s.method=document.getElementById('smethod2').value;save();closeModal();render();toast('Vente modifiée.')}
function delPay(id,k){let s=db.sales.find(x=>x.id===id);s.payments.splice(k,1);s.paid=s.payments.reduce((a,p)=>a+p.amount,0);save();openModal('saleedit',id);render()}
function delSale(id){let s=db.sales.find(x=>x.id===id);if(!confirm('Supprimer la vente '+s.receipt+' ? Le stock des articles sera remis.'))return;s.items.forEach(i=>{let p=db.products.find(x=>x.id===i.productId);if(p)p.stock+=i.qty});db.sales=db.sales.filter(x=>x.id!==id);save();closeModal();render();toast('Vente supprimée, stock remis.')}
function delItem(t,id){let k={product:'products',expense:'expenses',customer:'customers'}[t];if(!confirm(t==='customer'?'Supprimer ce client ? Ses ventes restent enregistrées.':'Supprimer définitivement cet élément ?'))return;if(t==='customer')db.sales.forEach(s=>{if(s.customerId===id){s.customer=cn(s);s.customerId=null}});db[k]=db[k].filter(x=>x.id!==id);save();closeModal();render();toast('Supprimé.')}
function receipt(id){let s=db.sales.find(x=>x.id===id);let w=window.open('','_blank');if(!w){toast('Autorisez les fenêtres contextuelles pour afficher le reçu.');return}w.document.write(`<html><head><title>Reçu ${esc(s.receipt)}</title><style>body{font:15px Arial;max-width:500px;margin:40px auto;padding:20px;color:#111}h1{font-size:23px}hr{border:0;border-top:1px solid #ddd}table{width:100%;border-collapse:collapse}td{padding:9px 0;border-bottom:1px solid #eee}.right{text-align:right}.muted{color:#777;font-size:12px}@media print{button{display:none}}</style></head><body><h1>${esc(db.company.name)}</h1><p class="muted">Reçu de vente · ${s.date} · Référence ${esc(s.receipt)}</p><hr><p>Client : <b>${esc(cn(s))}</b></p><table>${s.items.map(i=>`<tr><td>${esc(i.name)} × ${i.qty}</td><td class="right">${fmt(i.price*i.qty)}</td></tr>`).join('')}</table><h2>Total : ${fmt(s.total)}</h2><p>Payé : ${fmt(s.paid)}</p>${(s.payments||[]).map(p=>`<p class="muted">${p.date} : ${fmt(p.amount)}</p>`).join('')}<p>Reste à payer : ${fmt(due(s))}</p><p class="muted">Merci pour votre confiance.</p><button onclick="window.print()">Imprimer / Enregistrer en PDF</button></body></html>`);w.document.close()}
function remind(id){let c=db.customers.find(x=>x.id===id),p=(c.phone||'').replace(/\D/g,''),duec=db.sales.filter(s=>s.customerId===id).reduce((a,s)=>a+due(s),0);if(!duec){toast('Aucun solde restant pour ce client.');return}if(!p){toast('Ajoutez un numéro WhatsApp pour ce client (Modifier).');return}if(!confirm('Ouvrir WhatsApp pour préparer une relance de '+fmt(duec)+' à '+c.name+' ? Vous pourrez vérifier le message avant envoi.'))return;let text=`Bonjour ${c.name}, petit rappel concernant le solde restant de ${fmt(duec)}. Merci de nous tenir informés. Bonne journée !`;window.open('https://wa.me/'+p+'?text='+encodeURIComponent(text),'_blank')}
function ask(q){let query=String(q).toLowerCase(),out='';if(query.includes('rentab')||query.includes('produit')){let a=db.products.map(p=>{let sold=db.sales.flatMap(s=>s.items).filter(i=>i.productId===p.id);return {name:p.name,profit:sold.reduce((z,i)=>z+(i.price-i.buy)*i.qty,0),qty:sold.reduce((z,i)=>z+i.qty,0)}}).sort((a,b)=>b.profit-a.profit);out='Marge brute par produit (selon les ventes saisies) :\n'+a.map(x=>`• ${x.name} : ${fmt(x.profit)} (${x.qty} vendu(s))`).join('\n')+'\n\nUne marge élevée ne garantit pas à elle seule la meilleure rentabilité globale : tenez aussi compte des frais et du volume.'}
else if(query.includes('dépense')||query.includes('depense')||query.includes('charge')){let a={};db.expenses.forEach(e=>a[e.category]=(a[e.category]||0)+e.amount);out='Dépenses par catégorie :\n'+(Object.keys(a).length?Object.entries(a).sort((x,y)=>y[1]-x[1]).map(([k,v])=>`• ${k} : ${fmt(v)}`).join('\n'):'Aucune dépense saisie.')+'\nTotal des dépenses enregistrées : '+fmt(totalExpenses())+'.'}
else if(query.includes('stock')||query.includes('réappro')||query.includes('reappro')){let a=db.products.filter(p=>p.stock<=p.min);out=a.length?'Produits à surveiller :\n'+a.map(p=>`• ${p.name} : ${p.stock} en stock (seuil ${p.min})`).join('\n'):'Aucun produit n’est sous son seuil d’alerte. Vérifiez néanmoins vos ventes prévues.'}
else if(query.includes('semaine')||query.includes('récent')||query.includes('recent')||query.includes('chiffre')||query.includes('vente')){let a=byDate(db.sales,7),rev=a.reduce((z,s)=>z+s.total,0);out='Sur les 7 derniers jours calendaires enregistrés :\n• Chiffre d’affaires : '+fmt(rev)+'\n• Nombre de ventes : '+a.length+'\n• Encaissements associés : '+fmt(a.reduce((z,s)=>z+s.paid,0))+'\n• Marge brute estimée : '+fmt(grossProfit(a))+'.'}
else if(query.includes('marge')||query.includes('amélior')){let a=db.products.filter(p=>p.sell>0).map(p=>({name:p.name,margin:(p.sell-p.buy)/p.sell*100,amount:p.sell-p.buy})).sort((x,y)=>x.margin-y.margin);out='Pistes à examiner à partir des prix saisis :\n'+a.map(p=>`• ${p.name} : marge brute unitaire ${fmt(p.amount)} (${p.margin.toFixed(1)} % du prix de vente)`).join('\n')+'\n\nTestez une petite hausse de prix sur certains articles, négociez le coût d’achat et suivez l’effet sur les ventes avant de décider.'}
else if(query.includes('crédit')||query.includes('credit')||query.includes('encaisser')||query.includes('dette')){out='Montant restant à encaisser : '+fmt(db.sales.reduce((z,s)=>z+due(s),0))+'.\nVentes concernées : '+db.sales.filter(s=>due(s)>0).length+'.\nConsultez Clients & crédits pour examiner chaque vente.'}
else{out='Je peux analyser les ventes récentes, les produits les plus rentables, les dépenses, les stocks faibles, les marges ou les crédits. Essayez une de ces questions.\n\nJe ne dispose que des données enregistrées dans cette démonstration.'}
let el=document.getElementById('airesult');el.textContent=out;el.classList.remove('hidden')}
function exportCSV(type){let rows=[];if(type==='sales'){rows=[['Référence','Date','Client','Total XOF','Payé XOF','Reste XOF','Mode'],...db.sales.map(s=>[s.receipt,s.date,cn(s),s.total,s.paid,due(s),s.method])]}else if(type==='products'){rows=[['Produit','Référence','Prix achat','Prix vente','Stock','Seuil'],...db.products.map(p=>[p.name,p.sku,p.buy,p.sell,p.stock,p.min])]}else{rows=[['Date','Libellé','Catégorie','Montant XOF'],...db.expenses.map(e=>[e.date,e.label,e.category,e.amount])]}let csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');let blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kagis-business-'+type+'-'+today()+'.csv';a.click();URL.revokeObjectURL(a.href)}
async function backup(){let name='kagis-business-sauvegarde-'+today()+'.json',f=new File([JSON.stringify(db,null,2)],name,{type:'application/json'});try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});db.lastBackup=today();save();render();toast('Sauvegarde partagée.');return}}catch(e){if(e.name==='AbortError')return}let a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);db.lastBackup=today();save();render();toast('Sauvegarde téléchargée.')}
function restore(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.products||!d.sales||!d.expenses||!d.customers)throw Error();db=migrate(d);save();render();toast('Sauvegarde restaurée.')}catch(e){toast('Fichier invalide ou incompatible.')}input.value=''};r.readAsText(f)}
function saveSettings(){db.company.name=document.getElementById('setname').value.trim()||'Mon entreprise';db.company.owner=document.getElementById('setowner').value.trim()||'Gestionnaire';db.company.phone=document.getElementById('setphone').value.trim();save();render();toast('Paramètres enregistrés.')}
function startFresh(){if(!confirm('Effacer TOUTES les données de cet appareil (produits, ventes, clients, dépenses) ? Faites d’abord une sauvegarde JSON. Cette action est définitive.'))return;db=migrate(blank());save();render();toast('Application remise à zéro.')}
function resetDemo(){if(!confirm('Effacer les données locales et recharger les exemples ? Exportez une sauvegarde avant de continuer.'))return;db=migrate(structuredClone(seed));save();render();toast('Données de démonstration réinitialisées.')}
function pdfHTML(type){let title,head,rows,right=[],foot='';
if(type==='sales'){title='Historique des ventes';head=['Référence','Date','Client','Total','Payé','Reste','Mode'];right=[3,4,5];rows=db.sales.slice().sort((a,b)=>b.id-a.id).map(s=>[s.receipt,s.date,cn(s),fmt(s.total),fmt(s.paid),fmt(due(s)),s.method]);foot='Chiffre d’affaires : '+fmt(allRevenue())+' · Encaissé : '+fmt(totalPaid())+' · Reste à encaisser : '+fmt(db.sales.reduce((z,s)=>z+due(s),0))}
else if(type==='products'){title='Produits & stocks';head=['Produit','Référence','Prix d’achat','Prix de vente','Stock','Seuil'];right=[2,3,4,5];rows=db.products.map(p=>[p.name,p.sku||'—',fmt(p.buy),fmt(p.sell),p.stock,p.min]);foot='Valeur du stock au prix d’achat : '+fmt(db.products.reduce((a,p)=>a+p.stock*p.buy,0))}
else{title='Journal des dépenses';head=['Date','Libellé','Catégorie','Montant'];right=[3];rows=db.expenses.slice().sort((a,b)=>b.id-a.id).map(e=>[e.date,e.label,e.category,fmt(e.amount)]);foot='Total des dépenses : '+fmt(totalExpenses())}
let th=head.map((h,i)=>`<th class="${right.includes(i)?'r':''}">${esc(h)}</th>`).join('');
let tr=rows.length?rows.map(r=>'<tr>'+r.map((v,i)=>`<td class="${right.includes(i)?'r':''}">${esc(v)}</td>`).join('')+'</tr>').join(''):`<tr><td colspan="${head.length}" style="text-align:center;color:#777">Aucune donnée enregistrée.</td></tr>`;
return `<h1>${esc(db.company.name)}</h1><div class="meta">${esc(title)} · édité le ${today()}</div><table><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table><div class="foot">${esc(foot)}</div>`}
function exportPDF(type){let z=document.getElementById('printzone'),old=document.title;z.innerHTML=pdfHTML(type);document.body.classList.add('printing');document.title='kagis-business-'+type+'-'+today();let done=()=>{document.body.classList.remove('printing');z.innerHTML='';document.title=old};addEventListener('afterprint',done,{once:true});setTimeout(()=>window.print(),150)}
let deferredInstall=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;let b=document.getElementById('installbtn');if(b)b.classList.remove('hidden')});
addEventListener('appinstalled',()=>{deferredInstall=null;let b=document.getElementById('installbtn');if(b)b.classList.add('hidden');toast('Application installée.')});
function installApp(){if(!deferredInstall){toast('Menu ⋮ du navigateur → « Installer l’application ».');return}deferredInstall.prompt();deferredInstall.userChoice.finally(()=>{deferredInstall=null;let b=document.getElementById('installbtn');if(b)b.classList.add('hidden')})}
render();try{navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(()=>{}));
</script>
</body></html>
